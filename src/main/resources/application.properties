resend.api-key=${RESEND_API_KEY:default_resend_key}
mailgun.domain=${MAILGUN_DOMAIN:default_mailgun_domain}
mailgun.api-key=${MAILGUN_API_KEY:default_mailgun_key}
# 소셜 로그인 (Kakao)
oauth.kakao.client-id=${KAKAO_CLIENT_ID:default_kakao_client_id}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:default_kakao_client_secret}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}

# 소셜 로그인 (Google)
oauth.google.client-id=${GOOGLE_CLIENT_ID:default_google_client_id}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:default_google_client_secret}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
