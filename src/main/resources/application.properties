spring.application.name=backend

# Transaction Pooler
spring.datasource.url=${DB_URL:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Flyway Configuration
spring.flyway.url=${FLYWAY_DB_URL:${DB_URL:${spring.datasource.url}}}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# JWT 설정
jwt.secret=${JWT_SECRET:default_jwt_secret_key_for_local_development_123456}
jwt.expiration-ms= 86400000

app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:None}
app.cookie.domain=${APP_COOKIE_DOMAIN:}

